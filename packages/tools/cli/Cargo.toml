[package]
name = "taladb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB command-line dev tools (inspect, export, import)"

[lints]
workspace = true

[[bin]]
name = "taladb"
path = "src/main.rs"

[dependencies]
taladb-core = { path = "../../core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tiny_http = "0.12"

# Used by `taladb studio` (the local web UI) to proxy requests.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"
ulid     = "1.1"
