<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TalaDB e2e</title>
  </head>
  <body>
    <h1>TalaDB e2e harness</h1>
    <pre id="out"></pre>
    <script type="module">
      import * as taladb from '/taladb/index.browser.mjs';
      window.taladb = taladb;
      window.__logs = [];
      const origWarn = console.warn.bind(console);
      console.warn = (...a) => { window.__logs.push(['warn', a.map(String).join(' ')]); origWarn(...a); };
      const origErr = console.error.bind(console);
      console.error = (...a) => { window.__logs.push(['error', a.map(String).join(' ')]); origErr(...a); };
      window.__ready = true;
      document.getElementById('out').textContent = 'ready';
    </script>
  </body>
</html>
