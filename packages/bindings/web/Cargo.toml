[package]
name = "taladb-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB browser WASM bindings (wasm-bindgen + OPFS) and Cloudflare Workers"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops serde_yaml + unsafe-libyaml: the browser
# receives its config as a JSON string and never reads a file off disk.
taladb-core = { path = "../../core", default-features = false, features = ["encryption"] }
redb = "2.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }
# `rand` (pulled in by taladb-core's `encryption` feature) depends on
# getrandom 0.2, which needs its `js` backend explicitly enabled for wasm.
# Renamed so it can coexist with the 0.3 line above; the feature unifies
# across the whole dependency graph.
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "Storage",
  "StorageManager",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemSyncAccessHandle",
  "FileSystemWritableFileStream",
]

[features]
# Build a WASM bundle without OPFS/browser APIs for Cloudflare Workers.
# Excludes openWithOpfs and FileSystemSyncAccessHandle imports.
cf-workers = []

# Size beats speed for a payload that is fetched, decoded and compiled on every
# cold start. `-Oz` plus name-section stripping is worth more to time-to-first-
# query than any codegen difference in the query engine.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--strip-debug", "--strip-producers"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
