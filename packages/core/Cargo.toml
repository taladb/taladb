[package]
name = "taladb-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB core: embedded local-first document database powered by redb"
readme = "README.md"
keywords = ["database", "embedded", "local-first", "vector-search", "wasm"]
categories = ["database-implementations", "wasm", "data-structures"]

[lints]
workspace = true

[dependencies]
redb       = "2.1"
postcard   = { version = "1.0", features = ["alloc"] }
serde      = { version = "1.0", features = ["derive"] }
ulid       = { version = "1.1", features = ["serde"] }
thiserror  = "1.0"
tracing    = "0.1"
regex      = { version = "1.11", default-features = false, features = ["std", "unicode-perl"] }
# Encryption optional deps — only pulled in when `encryption` feature is enabled.
aes-gcm          = { version = "0.10", optional = true }
rand             = { version = "0.8",  optional = true }
pbkdf2           = { version = "0.12", optional = true }
hmac             = { version = "0.12", optional = true }
sha2             = { version = "0.10", optional = true }
zeroize          = { version = "1.7",  optional = true, features = ["derive"] }
# HNSW approximate nearest-neighbor index — opt-in via `vector-hnsw` feature.
# Pure Rust, WASM-compatible, MIT license.
instant-distance = { version = "0.6", optional = true }
# Config parsing — JSON always; YAML only behind `config-yaml`.
serde_json = { version = "1.0", features = ["preserve_order"] }
# serde_yaml drags in unsafe-libyaml. Browser and React Native builds receive
# their config as a JSON string and never read a file off disk, so paying for a
# YAML parser there is pure bundle weight — hence the feature gate.
serde_yaml = { version = "0.9", optional = true }
# WASM-compatible SystemTime — re-exports std::time on native, uses js_sys::Date on wasm32.
web-time = "1"
# Random bytes — used for ULID generation. wasm_js feature enabled by taladb-web for WASM targets.
getrandom = "0.3"
# NOTE: endpoint validation deliberately does not use the `url` crate — it pulls
# in `idna` and its Unicode tables, which is significant permanent weight in a
# WASM bundle. See `config::split_http_endpoint`.
# HTTP push sync — only pulled in when the `sync-http` feature is enabled.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[features]
default      = ["config-yaml"]
encryption   = ["dep:aes-gcm", "dep:rand", "dep:pbkdf2", "dep:hmac", "dep:sha2", "dep:zeroize"]
vector-hnsw  = ["dep:instant-distance"]
sync-http    = ["dep:reqwest"]
# Parse `taladb.config.yml`. On by default for native/CLI use; browser and React
# Native builds turn it off (`default-features = false`) to drop serde_yaml and
# unsafe-libyaml from the bundle. JSON config works either way.
config-yaml  = ["dep:serde_yaml"]

[[bench]]
name = "engine"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.10"
wiremock = "0.6"
tokio    = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
zeroize  = { version = "1.7", features = ["derive"] }
