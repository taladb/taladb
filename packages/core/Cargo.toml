[package]
name = "taladb-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB core: embedded local-first document database powered by redb"
readme = "README.md"
keywords = ["database", "embedded", "local-first", "vector-search", "wasm"]
categories = ["database-implementations", "wasm", "data-structures"]

[lints]
workspace = true

[dependencies]
redb       = "4.2"
# `default-features = false` drops postcard's default `heapless-cas` feature.
# Only `to_allocvec` and `from_bytes` are used here — both `alloc` APIs — while
# the default pulls in heapless 0.7 and, through it, the unmaintained
# `atomic-polyfill` (RUSTSEC-2023-0089). Nothing in this workspace uses heapless,
# so it was dependency weight in every build and an advisory in `cargo audit`.
postcard   = { version = "1.0", default-features = false, features = ["alloc"] }
serde      = { version = "1.0", features = ["derive"] }
ulid       = { version = "1.1", features = ["serde"] }
thiserror  = "2.0"
tracing    = "0.1"
regex      = { version = "1.11", default-features = false, features = ["std", "unicode-perl"] }
# Encryption optional deps — only pulled in when `encryption` feature is enabled.
aes-gcm          = { version = "0.11", optional = true }
pbkdf2           = { version = "0.13", optional = true }
hmac             = { version = "0.13", optional = true }
sha2             = { version = "0.11", optional = true }
zeroize          = { version = "1.7",  optional = true, features = ["derive"] }
# HNSW approximate nearest-neighbor index — opt-in via `vector-hnsw` feature.
# Pure Rust, WASM-compatible, MIT license.
instant-distance = { version = "0.6", optional = true }
# Config parsing — JSON always; YAML only behind `config-yaml`.
serde_json = { version = "1.0", features = ["preserve_order"] }
# `serde_yaml_ng`, not `serde_yaml`: the original was deprecated by its author and
# is no longer maintained, so a YAML parsing bug would never be fixed upstream —
# and this parses a file off disk. `serde_yaml_ng` is the maintained continuation
# and is API-compatible, so the swap is one call site.
#
# (Not `serde_yml`, which crates.io now marks "DEPRECATED — unmaintained, a thin
# compatibility shim". The fork landscape here is littered; `serde_yaml_ng` and
# `serde_norway` are the two live ones.)
#
# Caveat worth knowing: this swaps the *wrapper* for a maintained one, but
# `serde_yaml_ng` still depends on the original `unsafe-libyaml`, which was
# deprecated alongside `serde_yaml`. So the unsafe parsing code in the tree is
# unchanged. `serde_norway` is the alternative that also forked the parser
# (`unsafe-libyaml-norway`); switching is the same one-line change if that ever
# matters. It is judged not to today: this parses `taladb.config.yml`, a file the
# application ships, not untrusted input, and `cargo audit` flags neither crate.
#
# Still optional: browser and React Native builds receive their config as a JSON
# string and never read a file off disk, so a YAML parser there is pure bundle
# weight — hence the feature gate.
serde_yaml_ng = { version = "0.10", optional = true }
# WASM-compatible SystemTime — re-exports std::time on native, uses js_sys::Date on wasm32.
web-time = "1"
# Random bytes — used for ULID generation. wasm_js feature enabled by taladb-web for WASM targets.
getrandom = "0.4"
# NOTE: endpoint validation deliberately does not use the `url` crate — it pulls
# in `idna` and its Unicode tables, which is significant permanent weight in a
# WASM bundle. See `config::split_http_endpoint`.

[features]
default      = ["config-yaml"]
encryption   = ["dep:aes-gcm", "dep:pbkdf2", "dep:hmac", "dep:sha2", "dep:zeroize"]
vector-hnsw  = ["dep:instant-distance"]
# Parse `taladb.config.yml`. On by default for native/CLI use; browser and React
# Native builds turn it off (`default-features = false`) to drop serde_yaml and
# unsafe-libyaml from the bundle. JSON config works either way.
config-yaml  = ["dep:serde_yaml_ng"]

[[bench]]
name = "engine"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.10"
zeroize  = { version = "1.7", features = ["derive"] }

# redb 2, kept alongside redb 4 solely to migrate databases written before the
# bump. redb 4 refuses a v2 file outright ("Manual upgrade required") and offers
# no upgrade API, so the only way to not brick every existing database is to read
# it with the version that wrote it and copy it forward. Two majors of redb link
# into one binary without conflict — they are distinct crates to cargo.
#
# Native only: this exists for `RedbBackend::open`, which owns a real file it can
# back up and atomically replace. The browser/OPFS path has no such filesystem
# and is handled separately — see `migrate::detect_legacy_backend`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb2 = { package = "redb", version = "2.6" }
