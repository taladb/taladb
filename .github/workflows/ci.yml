name: CI

on:
  # Post-merge validation on the long-lived branches. Feature branches are
  # covered by the pull_request event below; a PR *into* dev or main will run
  # twice once merged (once for the PR, once for the push), which is the point —
  # the second run validates the merge result, not the branch in isolation.
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # No paths-ignore here on purpose: `ci-pass` is the required status check in
  # branch protection, and a skipped workflow never reports one — a docs-only PR
  # would hang forever on "Waiting for status".
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# One run per PR (or per branch). A new push cancels the in-flight run for the
# same PR instead of queueing a second full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the cross-platform build matrix.
  #
  # macOS runners bill at 10x the Linux rate and Windows at 2x, so pull requests
  # and pushes to `dev` build Linux only. The full three-OS matrix runs
  # post-merge on `main` (and on manual dispatch), which is what gates releases
  # anyway — `release.yml` rebuilds every platform artifact from the tag.
  #
  # Trade-off: a Windows- or macOS-only compile break surfaces on `main`
  # rather than in the PR or on `dev`. Run the workflow manually (Actions → CI →
  # Run workflow) on a branch touching platform-specific code to check early.
  # ---------------------------------------------------------------------------
  setup:
    name: Setup — resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.matrix.outputs.node }}
      cli: ${{ steps.matrix.outputs.cli }}
    steps:
      - name: Pick matrix for ${{ github.event_name }}
        id: matrix
        run: |
          # Pull requests and pushes to `dev` build Linux only. `dev` sees far
          # more pushes than `main`, and the full matrix costs 10x per macOS
          # minute — the cross-platform check belongs at the `main` merge, which
          # is what gates a release.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            node='[{"os":"ubuntu-latest","artifact":"taladb-node-linux"}]'
            cli='[{"os":"ubuntu-latest","artifact":"taladb-linux-x86_64","bin":"taladb"}]'
          else
            node='[{"os":"ubuntu-latest","artifact":"taladb-node-linux"},{"os":"macos-latest","artifact":"taladb-node-macos"},{"os":"windows-latest","artifact":"taladb-node-windows"}]'
            cli='[{"os":"ubuntu-latest","artifact":"taladb-linux-x86_64","bin":"taladb"},{"os":"macos-latest","artifact":"taladb-macos-aarch64","bin":"taladb"},{"os":"windows-latest","artifact":"taladb-windows-x86_64","bin":"taladb.exe"}]'
          fi
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "cli=$cli"   >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Lint & Test — native Rust (fast, no WASM toolchain needed)
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Deliberately no toolchain action. `rust-toolchain.toml` pins the
      # version, components and wasm target, and rustup — preinstalled on the
      # runner — honours a directory override file ahead of any default an action
      # would set. Installing a toolchain here would download one that never gets
      # used and, worse, attach clippy/rustfmt to the wrong version. The pin is
      # the point: the compiler must not move under the repo between commits,
      # which is how the `-D warnings` gate went red overnight when 1.98 landed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest failure and needs no build.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-features

      # `--all-targets` lints tests and benches too — previously they were never
      # linted at all. `--all-features` reaches the `encryption`, `vector-hnsw`
      # and `config-yaml` code, none of which is on by default.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `--all-features` is load-bearing, not tidiness: `tests/encryption.rs` and
      # `tests/vector_hnsw.rs` both open with `#![cfg(feature = "...")]`, so
      # without it they compile to nothing and CI reports a pass having run
      # neither. The HNSW suite includes the regression test for the `top_k`
      # overflow in `find_nearest`, so dropping the flag silently un-guards it.
      - name: cargo test
        run: cargo test --workspace --all-features

      # The web binding is only ever *built* by wasm-pack elsewhere in this
      # workflow, so nothing lints it. `usize` is 32-bit on wasm32 and several
      # findings only exist there, which makes this the target most worth linting.
      - name: cargo clippy (wasm32)
        run: cargo clippy -p taladb-web --target wasm32-unknown-unknown --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Supply chain — advisories against the committed Cargo.lock
  #
  # Split from `rust-check` so an advisory published upstream shows up as its own
  # red job rather than masquerading as a code failure, and so it keeps running
  # when the lint job is broken. `continue-on-error` is deliberately absent: a
  # warn-only advisory check is one nobody reads.
  #
  # `--deny warnings` promotes unmaintained/unsound/yanked to failures, not just
  # vulnerabilities. That is only sustainable because the tree is currently clean
  # of all four — reaching that took bumping crossbeam-epoch, anyhow, spin,
  # unicode-segmentation and both `rand` lines, and dropping postcard's default
  # `heapless-cas` feature (which pulled in the unmaintained `atomic-polyfill`).
  #
  # When an advisory lands that genuinely cannot be fixed — a transitive dep with
  # no patched release — add it to a `.cargo/audit.toml` `[advisories] ignore`
  # list with a comment saying why and when to revisit. Do not reach for
  # `continue-on-error`: that silences every future advisory too.
  # ---------------------------------------------------------------------------
  rust-audit:
    name: Rust — cargo audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # MSRV — the floor downstream users must satisfy
  #
  # `rust-toolchain.toml` pins what *we* build with (currently well ahead of this);
  # `rust-version` in Cargo.toml is a promise to consumers, and nothing was checking
  # it. Adopting redb 4 forced it from 1.88 to 1.90 and the workspace build stayed
  # green throughout, because the pinned toolchain compiles anything — the break was
  # invisible until someone ran this by hand. Now it is not.
  #
  # A failure here means either a dependency raised its own floor, or new code used
  # something newer than the declared minimum. Both are decisions, not accidents:
  # raise `rust-version` deliberately (it is a breaking change) or pin the dependency
  # back.
  # ---------------------------------------------------------------------------
  rust-msrv:
    name: Rust — MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $msrv"

      - name: Install the declared MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # `check`, not `test`: dev-dependencies are free to require a newer compiler
      # than the published crates do, and holding them to the consumer floor would
      # be a promise nobody asked for.
      - name: cargo check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  # ---------------------------------------------------------------------------
  # Miri — undefined-behaviour check over the FFI's raw-pointer layer
  #
  # Scoped to the `miri_safe` module on purpose. Miri interprets rather than
  # executes, and redb's B-tree and page machinery is far too much work to
  # interpret: one in-memory open plus a single insert does not finish in eight
  # minutes. Pointing Miri at the whole suite would mean a job that always times
  # out, which is the same as no job. `miri_safe` holds the tests that exercise
  # the raw-pointer layer without touching a database, and runs in ~6 seconds.
  #
  # Nightly, because Miri only exists there — this is the one place the pinned
  # toolchain is deliberately bypassed.
  # ---------------------------------------------------------------------------
  rust-miri:
    name: Rust — miri (FFI pointer layer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly with miri
        run: |
          rustup toolchain install nightly --component miri
          rustup run nightly cargo miri setup

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      # Both aliasing models: Stacked Borrows is the default, Tree Borrows is
      # stricter about how references derived from raw pointers may be used.
      - name: cargo miri test (stacked borrows)
        run: cargo +nightly miri test -p taladb-ffi -- miri_safe
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: cargo miri test (tree borrows)
        run: cargo +nightly miri test -p taladb-ffi -- miri_safe
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows

  # ---------------------------------------------------------------------------
  # Fuzzing — time-boxed smoke run over every target
  #
  # 60s per target, not a soak. The point is to keep the targets *building* and
  # to catch a regression that any seeded input reaches; finding genuinely new
  # bugs takes hours and belongs in a scheduled or manual run, not in the path of
  # every push. The committed `seeds/` corpus is what makes a minute useful — with
  # random bytes alone the parser targets would spend the whole budget failing to
  # produce valid JSON.
  #
  # Nightly, because cargo-fuzz requires it. The fuzz crate is its own workspace
  # root (see its Cargo.toml), so it is not covered by the main rust-check job.
  # ---------------------------------------------------------------------------
  rust-fuzz:
    name: Rust — fuzz (smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: |
            .
            packages/core/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Build every target first. A target that stops compiling is the failure
      # mode this job is most likely to catch, and it should be reported as a
      # build error rather than as a fuzzing failure.
      - name: Build all fuzz targets
        working-directory: packages/core/fuzz
        run: |
          for t in $(sed -n 's/^name = "\(fuzz_[a-z_]*\)"$/\1/p' Cargo.toml); do
            echo "::group::build $t"
            cargo +nightly fuzz build "$t"
            echo "::endgroup::"
          done

      - name: Fuzz (60s per target)
        working-directory: packages/core/fuzz
        env:
          SECONDS_PER_TARGET: 60
        run: ./run.sh

      # A crash is only actionable with the input that caused it.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: packages/core/fuzz/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # TypeScript type-check
  # ---------------------------------------------------------------------------
  ts-check:
    name: TypeScript — type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit (taladb)
        run: node_modules/.bin/tsc -p packages/clients/taladb/tsconfig.json --noEmit

      - name: tsc --noEmit (@taladb/react)
        run: node_modules/.bin/tsc -p packages/clients/react/tsconfig.json --noEmit

      - name: tsc --noEmit (@taladb/react-native)
        run: node_modules/.bin/tsc -p packages/bindings/react-native/tsconfig.json --noEmit

      - name: Build TypeScript packages and storefront example
        run: |
          pnpm --filter taladb build
          pnpm --filter @taladb/react build
          pnpm --filter example-vite-spa-storefront build


  # ---------------------------------------------------------------------------
  # Build — WASM (wasm-pack)
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build — WASM
    runs-on: ubuntu-latest
    needs: rust-check

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add build targets
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM (release)
        run: wasm-pack build packages/bindings/web --target web --out-dir pkg --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: taladb-web-pkg
          path: packages/bindings/web/pkg/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build — Node.js native module (napi-rs)
  # ---------------------------------------------------------------------------
  build-node:
    name: Build — Node.js (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, rust-check]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.node) }}

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: node

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native module
        working-directory: packages/bindings/node
        run: pnpm build

      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/bindings/node/*.node
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build — CLI binary
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build — CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, rust-check]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.cli) }}

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cli

      - name: Build CLI (release)
        run: cargo build -p taladb-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build — taladb TypeScript package (tsup)
  # ---------------------------------------------------------------------------
  build-taladb:
    name: Build — taladb (TS)
    runs-on: ubuntu-latest
    needs: [ts-check, build-node]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The sync e2e suite (tests/sync.e2e.test.ts) runs against the real
      # native engine — download the freshly built linux binary so it executes
      # instead of skipping. This is the suite that would have caught the
      # 0.8.4 sync regressions.
      - name: Download Node.js native module
        uses: actions/download-artifact@v4
        with:
          name: taladb-node-linux
          path: packages/bindings/node

      - name: Unit + e2e tests
        working-directory: packages/clients/taladb
        run: pnpm test

      - name: Build
        working-directory: packages/clients/taladb
        run: pnpm exec tsup

      - name: Verify dist/ output
        working-directory: packages/clients/taladb
        run: ls dist/index.mjs dist/index.js dist/index.d.ts dist/index.react-native.mjs

  # ---------------------------------------------------------------------------
  # Test + Build — @taladb/react hooks package
  # ---------------------------------------------------------------------------
  build-taladb-react:
    name: Build — @taladb/react (TS)
    runs-on: ubuntu-latest
    needs: [ts-check, build-node]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The query layer's hydration and query-record suites run against the real
      # engine — a fake cannot answer whether the engine accepts a derived `_id`
      # or rejects a duplicate. Without this they skip silently, which reads as
      # passing.
      - name: Download Node.js native module
        uses: actions/download-artifact@v4
        with:
          name: taladb-node-linux
          path: packages/bindings/node

      - name: Unit + integration tests
        working-directory: packages/clients/react
        run: pnpm test

      - name: Build
        working-directory: packages/clients/react
        run: pnpm exec tsup

      - name: Verify dist/ output
        working-directory: packages/clients/react
        run: ls dist/index.mjs dist/index.js dist/index.d.ts

  # ---------------------------------------------------------------------------
  # Publish gate — all jobs must pass before anything can be published.
  # Use this job as the required status check in branch protection rules
  # and as the `needs:` dependency in any publish/release workflow.
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI — all checks passed
    runs-on: ubuntu-latest
    needs:
      - setup
      - rust-check
      - rust-audit
      - rust-msrv
      - rust-miri
      - rust-fuzz
      - ts-check
      - build-wasm
      - build-node
      - build-cli
      - build-taladb
      - build-taladb-react
    if: always()
    steps:
      # Every job above runs unconditionally, so `skipped` here means an
      # upstream job failed and its dependents never ran — treat it as a
      # failure, otherwise the gate would go green on a broken run.
      - name: Check all jobs succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "One or more required jobs failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All jobs passed — safe to publish."
